<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Faculty Review</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 400px;
            max-width: 95%;
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        h2 { text-align: center; margin-bottom: 25px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #007bff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #message { margin-top: 15px; text-align: center; color: #c0392b; min-height: 20px; }
        p { margin-top: 18px; text-align: center; color: #555; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h2>Register</h2>

    <input type="text" id="name" placeholder="Full Name" autocomplete="name">
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password (min 4 chars)" autocomplete="new-password">
    <input type="email" id="email" placeholder="Email" autocomplete="email">

    <button id="regBtn" onclick="registerUser()">Register</button>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>

<script>
const API_URL = "http://faculty-review-full-stack-fast-java.onrender.com";

async function registerUser() {
    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("message");
    const btn = document.getElementById("regBtn");

    msg.textContent = "";

    if (!name || !username || !password || !email) {
        msg.textContent = "Please fill all fields.";
        return;
    }

    if (password.length < 4) {
        msg.textContent = "Password must be at least 4 characters.";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Registering...";

    try {
        const response = await fetch(API_URL + "/user/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, username, password, email })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Registration successful! Please login.");
            window.location.href = "login.html";
        } else {
            // FastAPI validation errors come as array sometimes
            if (Array.isArray(data.detail)) {
                msg.textContent = data.detail.map(e => e.msg).join(", ");
            } else {
                msg.textContent = data.detail || data.message || "Registration failed";
            }
        }
    } catch (err) {
        console.error(err);
        msg.textContent = "Cannot connect to server. Is FastAPI running?";
    } finally {
        btn.disabled = false;
        btn.textContent = "Register";
    }
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") registerUser();
});
</script>
</body>
</html>
