<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Review System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; }
        .buttons { display: flex; gap: 15px; justify-content: center; }
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: transform 0.15s, opacity 0.15s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .register { background: #007bff; }
        .login { background: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Faculty Review System</h1>
        <p>Securely manage faculty reviews with JWT authentication.</p>
        <div class="buttons">
            <button class="register" onclick="window.location.href='register.html'">Register</button>
            <button class="login" onclick="window.location.href='login.html'">Login</button>
        </div>
    </div>
</body>
</html>
